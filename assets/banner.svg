<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 470" width="1280" height="470" role="img" aria-labelledby="title desc">
  <title id="title">Product with AI</title>
  <desc id="desc">A free Pytopia course on YouTube: build a complete product from scratch with AI. Foundations, Plan, Build, Ship, Launch, then Get Hired or Go Indie, with user feedback looping back to Plan.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#161233"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.1" r="0.6">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.05" cy="1" r="0.5">
      <stop offset="0" stop-color="#60a5fa" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ai" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.06"/>
    </pattern>
    <marker id="arrow-step" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a78bfa"/>
    </marker>
    <marker id="arrow-done" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#34d399"/>
    </marker>
    <marker id="arrow-side" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#f472b6"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1280" height="470" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="470" rx="24" fill="url(#dots)"/>
  <rect width="1280" height="470" rx="24" fill="url(#glow)"/>
  <rect width="1280" height="470" rx="24" fill="url(#glow2)"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
    <!-- Heading -->
    <text x="80" y="104" font-size="15" font-weight="700" letter-spacing="3" fill="#a78bfa">PYTOPIA  ·  FREE COURSE ON YOUTUBE</text>
    <text x="78" y="180" font-size="72" font-weight="800" letter-spacing="-1.5" fill="#f8fafc">Product with <tspan fill="url(#ai)">AI</tspan></text>
    <text x="80" y="226" font-size="23" fill="#cbd5e1">Build a complete product from scratch, with AI.</text>

    <!-- Agent terminal card -->
    <g transform="translate(790 60)">
      <rect width="410" height="172" rx="14" fill="#0f172a" fill-opacity="0.85" stroke="#334155"/>
      <circle cx="22" cy="22" r="5.5" fill="#f472b6"/>
      <circle cx="40" cy="22" r="5.5" fill="#a78bfa"/>
      <circle cx="58" cy="22" r="5.5" fill="#34d399"/>
      <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
        <text x="24" y="66" font-size="16" fill="#e2e8f0"><tspan fill="#a78bfa" font-weight="700">&gt; </tspan>plan it, build it, ship it</text>
        <g font-size="14" fill="#94a3b8">
          <text x="24" y="104"><tspan fill="#34d399">✓</tspan> PM</text>
          <text x="114" y="104"><tspan fill="#34d399">✓</tspan> design</text>
          <text x="214" y="104"><tspan fill="#34d399">✓</tspan> frontend</text>
          <text x="314" y="104"><tspan fill="#34d399">✓</tspan> backend</text>
          <text x="24" y="138"><tspan fill="#34d399">✓</tspan> AI</text>
          <text x="114" y="138"><tspan fill="#34d399">✓</tspan> data</text>
          <text x="214" y="138"><tspan fill="#34d399">✓</tspan> quality</text>
          <text x="314" y="138"><tspan fill="#34d399">✓</tspan> deploy</text>
        </g>
      </g>
    </g>

    <!-- Edges -->
    <g fill="none">
      <g stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow-step)">
        <path d="M220 340 H258"/>
        <path d="M404 340 H442"/>
        <path d="M588 340 H626"/>
        <path d="M772 340 H810"/>
      </g>
      <g stroke="#34d399" stroke-width="3" marker-end="url(#arrow-done)">
        <path d="M956 340 C 990 340, 984 307, 1014 307"/>
        <path d="M956 340 C 990 340, 984 373, 1014 373"/>
      </g>
      <path d="M886 368 C 886 452, 334 452, 334 374" stroke="#f472b6" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-side)"/>
    </g>
    <rect x="552" y="418" width="116" height="24" rx="12" fill="#13112b"/>
    <text x="610" y="435" font-size="14" font-weight="600" fill="#f472b6" text-anchor="middle">user feedback</text>

    <!-- Nodes -->
    <g text-anchor="middle">
      <g>
        <rect x="80" y="312" width="140" height="56" rx="12" fill="#bfdbfe" stroke="#60a5fa" stroke-width="1.5"/>
        <text x="150" y="337" font-size="18" font-weight="700" fill="#1e3a5f">Foundations</text>
        <text x="150" y="356" font-size="12" fill="#1e3a5f" fill-opacity="0.75">Part 00</text>
      </g>
      <g fill="#3b1f7a">
        <rect x="264" y="312" width="140" height="56" rx="12" fill="#ddd6fe" stroke="#a78bfa" stroke-width="1.5"/>
        <text x="334" y="337" font-size="18" font-weight="700">Plan</text>
        <text x="334" y="356" font-size="12" fill-opacity="0.75">PM · design</text>

        <rect x="448" y="312" width="140" height="56" rx="12" fill="#ddd6fe" stroke="#a78bfa" stroke-width="1.5"/>
        <text x="518" y="337" font-size="18" font-weight="700">Build</text>
        <text x="518" y="356" font-size="12" fill-opacity="0.75">web · backend · AI</text>

        <rect x="632" y="312" width="140" height="56" rx="12" fill="#ddd6fe" stroke="#a78bfa" stroke-width="1.5"/>
        <text x="702" y="337" font-size="18" font-weight="700">Ship</text>
        <text x="702" y="356" font-size="12" fill-opacity="0.75">quality · deploy</text>

        <rect x="816" y="312" width="140" height="56" rx="12" fill="#ddd6fe" stroke="#a78bfa" stroke-width="1.5"/>
        <text x="886" y="337" font-size="18" font-weight="700">Launch</text>
        <text x="886" y="356" font-size="12" fill-opacity="0.75">and iterate</text>
      </g>
      <g fill="#064e3b">
        <rect x="1020" y="282" width="180" height="50" rx="12" fill="#a7f3d0" stroke="#34d399" stroke-width="1.5"/>
        <text x="1110" y="304" font-size="18" font-weight="700">Get Hired</text>
        <text x="1110" y="322" font-size="12" fill-opacity="0.75">portfolio case study</text>

        <rect x="1020" y="348" width="180" height="50" rx="12" fill="#a7f3d0" stroke="#34d399" stroke-width="1.5"/>
        <text x="1110" y="370" font-size="18" font-weight="700">Go Indie</text>
        <text x="1110" y="388" font-size="12" fill-opacity="0.75">first customers</text>
      </g>
    </g>
  </g>
</svg>
